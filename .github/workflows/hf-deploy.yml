name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "BACKEND/**"
      - ".github/workflows/hf-deploy.yml"

jobs:
  sync:
    name: Sync BACKEND → HF Space
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the HF Space repo
          git clone "https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf_repo

          # Sync BACKEND/ → Space root (skipping secrets and caches)
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.venv/' \
            BACKEND/ hf_repo/

          # Commit and push only if something changed
          cd hf_repo
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping push."
          else
            git commit -m "deploy: ${GITHUB_SHA::7}"
            git push
          fi
