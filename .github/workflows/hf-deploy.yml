name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/hf-deploy.yml"
  workflow_dispatch:

jobs:
  sync:
    name: Sync BACKEND → HF Space
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "❌ HF_TOKEN secret is not set. Add it in GitHub → Settings → Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.HF_SPACE }}" ]; then
            echo "❌ HF_SPACE secret is not set. It should be: yourusername/auditflow-backend"
            exit 1
          fi
          echo "✅ Secrets look good. HF_SPACE = ${{ secrets.HF_SPACE }}"

      - name: Clone HF Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf_repo
          echo "✅ Cloned HF Space successfully"

      - name: Sync BACKEND → Space root
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.venv/' \
            backend/ hf_repo/
          echo "✅ Files synced"

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          cd hf_repo
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping push."
          else
            git commit -m "deploy: ${GITHUB_SHA::7}"
            git push
            echo "✅ Pushed to HF Space — build starting on HF"
          fi
