name: Keep HF Space Alive

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://aummm19-auditflow-backend.hf.space/healthz)
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Space is alive"
          else
            echo "⚠️ Health check returned $STATUS — Space may be restarting"
          fi
